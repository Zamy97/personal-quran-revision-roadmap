<section class="onboard" aria-labelledby="onboard-heading">
  <div class="onboard-card" [class.busy]="preparing()">
    <span class="eyebrow">Welcome</span>
    <h1 id="onboard-heading">What have you memorized?</h1>
    <p class="lead">
      Pick the surahs you already know. We’ll build your weekly revision days and
      fill the Memorized tab from this list.
    </p>

    <div class="quick-row">
      <button
        type="button"
        class="chip"
        (click)="selectJuz30()"
        [disabled]="preparing()"
      >
        Juz 30
      </button>
      <button
        type="button"
        class="chip"
        (click)="selectRange(67, 77)"
        [disabled]="preparing()"
      >
        Mulk–Mursalat
      </button>
      <button
        type="button"
        class="chip"
        (click)="selectRange(36, 36)"
        [disabled]="preparing()"
      >
        Yasin
      </button>
      <button
        type="button"
        class="chip ghost"
        (click)="clearAll()"
        [disabled]="preparing()"
      >
        Clear
      </button>
    </div>

    <label class="search">
      <span class="sr-only">Search surahs</span>
      <input
        type="search"
        placeholder="Search by name or number"
        [ngModel]="search()"
        (ngModelChange)="search.set($event)"
        autocomplete="off"
        [disabled]="preparing()"
      />
    </label>

    <p class="count" aria-live="polite">
      {{ selectedCount }} surah{{ selectedCount === 1 ? '' : 's' }} selected
    </p>

    <div class="surah-grid" role="group" aria-label="Memorized surahs">
      <button
        type="button"
        class="surah-chip"
        *ngFor="let s of filteredSurahs"
        [class.on]="isSelected(s.number)"
        (click)="toggle(s.number)"
        [attr.aria-pressed]="isSelected(s.number)"
        [disabled]="preparing()"
      >
        <span class="num">{{ s.number }}</span>
        <span class="name">{{ s.name }}</span>
      </button>
    </div>

    <p class="error" *ngIf="error()" role="alert">{{ error() }}</p>

    <button
      type="button"
      class="submit"
      (click)="submit()"
      [disabled]="saving() || preparing() || selectedCount === 0"
    >
      {{ preparing() ? 'Building…' : 'Build my weekly plan' }}
    </button>
  </div>

  <div
    class="prepare-overlay"
    *ngIf="preparing()"
    role="status"
    aria-live="polite"
    aria-busy="true"
  >
    <div class="prepare-card">
      <div class="auth-loader" aria-hidden="true">
        <span class="auth-loader-ring"></span>
        <span class="auth-loader-dot"></span>
      </div>
      <p class="prepare-title">Setting up your plan</p>
      <p class="prepare-sub">{{ prepareMessage() }}</p>
    </div>
  </div>
</section>
