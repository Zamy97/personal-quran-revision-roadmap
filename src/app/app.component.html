<div class="boot" *ngIf="!auth.ready()" role="status" aria-live="polite" aria-busy="true">
  <div class="boot-card">
    <div class="auth-loader" aria-hidden="true">
      <span class="auth-loader-ring"></span>
      <span class="auth-loader-dot"></span>
    </div>
    <p class="boot-title">Revision Roadmap</p>
    <p class="boot-sub">Getting things ready…</p>
  </div>
</div>

<app-auth-gate *ngIf="auth.ready() && !auth.unlocked()"></app-auth-gate>

<app-curriculum-onboarding
  *ngIf="auth.ready() && auth.unlocked() && showOnboarding()"
  (completed)="onOnboardingDone()"
></app-curriculum-onboarding>

<router-outlet
  *ngIf="auth.ready() && auth.unlocked() && !showOnboarding()"
></router-outlet>
