<div class="boot" *ngIf="!auth.ready()" role="status" aria-live="polite">
  <p>Getting things ready…</p>
</div>

<app-auth-gate *ngIf="auth.ready() && !auth.unlocked()"></app-auth-gate>

<app-curriculum-onboarding
  *ngIf="auth.ready() && auth.unlocked() && showOnboarding()"
  (completed)="onOnboardingDone()"
></app-curriculum-onboarding>

<router-outlet
  *ngIf="auth.ready() && auth.unlocked() && !showOnboarding()"
></router-outlet>
